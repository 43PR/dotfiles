font_family JetBrainsMono Nerd Font
font_size 9
confirm_os_window_close 0

shell_integration enabled

# Workaround for old Intel GPUs (Ivy Bridge / HD 4000): create the window
# through GLX (XWayland) instead of EGL, which fails to init on this GPU.
linux_display_server x11

include matugen.conf

cursor_shape beam
cursor_blink_interval 0.5
